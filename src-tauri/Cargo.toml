[package]
name = "card-editor"
version = "0.2.5"
description = "卡牌编辑与打印"
authors = ["card-editor"]
edition = "2021"

[lib]
name = "card_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
